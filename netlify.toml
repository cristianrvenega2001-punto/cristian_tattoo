# ============================================================
# netlify.toml — Cristian Tattoo Los Andes Ink
# Headers de seguridad + Build config
# ============================================================

[build]
  publish = "."

# ── Headers de seguridad (sube nota de D a A) ──────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-XSS-Protection = "0"
    Cross-Origin-Opener-Policy = "same-origin"
    # Solo se cargan scripts, estilos, fuentes e imágenes del propio sitio,
    # de Google Fonts y de Cloudflare (íconos). Cualquier otro se bloquea.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# ── Caché de imágenes (velocidad de carga) ─────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Redirects útiles ───────────────────────────────────────
[[redirects]]
  from  = "/agenda"
  to    = "/agenda.html"
  status = 200

# ── Archivos internos: no se publican (responden 404) ──────
[[redirects]]
  from  = "/INSTRUCCIONES.md"
  to    = "/404.html"
  status = 404
  force = true

[[redirects]]
  from  = "/README.md"
  to    = "/404.html"
  status = 404
  force = true

[[redirects]]
  from  = "/generar-portafolio.js"
  to    = "/404.html"
  status = 404
  force = true

[[redirects]]
  from  = "/portafolio-section.html"
  to    = "/404.html"
  status = 404
  force = true

[[redirects]]
  from  = "/netlify.toml"
  to    = "/404.html"
  status = 404
  force = true

[[redirects]]
  from  = "/.git/*"
  to    = "/404.html"
  status = 404
  force = true
